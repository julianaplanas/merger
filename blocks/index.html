<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#f3ead9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Bloques</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="blocks.css">
</head>
<body>
  <div class="topbar" id="topbar"></div>
  <main class="blocks">
    <div class="hud">
      <div class="level" id="level"></div>
      <div class="moves" id="moves"></div>
      <div class="moves" id="left"></div>
      <div class="spacer"></div>
      <button class="btn small-btn" id="undo">↶</button>
      <button class="btn small-btn" id="restart">↻</button>
    </div>
    <div class="frame-wrap">
      <div class="frame" id="frame">
        <div class="exits" id="exits"></div>
        <div class="board" id="board"></div>
      </div>
    </div>
    <p class="hint muted small">Arrastrá una pieza hasta la salida de su color.</p>
    <div class="status" id="status"></div>
    <div class="confetti" id="confetti"></div>

    <div class="overlay" id="win" hidden>
      <div class="card">
        <p class="muted small">Completado</p>
        <h1 id="win-title"></h1>
        <p id="win-text"></p>
        <div class="row"><button class="btn primary" id="win-next">Siguiente nivel</button></div>
      </div>
    </div>
    <div class="overlay" id="lock" hidden>
      <div class="card"><h1 id="lock-title"></h1><p id="lock-text"></p></div>
    </div>
  </main>
  <script src="../common.js"></script>
  <script>HUB.mountTopbar(document.getElementById('topbar'), 'Bloques');</script>
  <script src="blocks.js"></script>
</body>
</html>
